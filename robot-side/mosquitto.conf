# Mosquitto — 브리지(1883, TCP) + 브라우저(9001, WebSocket)
#   sudo apt install mosquitto
#   sudo cp mosquitto.conf /etc/mosquitto/conf.d/robot.conf && sudo systemctl restart mosquitto

listener 1883
protocol mqtt

listener 9001
protocol websockets

# 개발용(LAN 한정). 실사용에서는 false + password_file + ACL 로 cmd/# 쓰기 권한을 제한하세요.
allow_anonymous true
# password_file /etc/mosquitto/passwd
# acl_file /etc/mosquitto/acl
